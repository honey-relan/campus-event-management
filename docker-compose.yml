version: "3.8"

services:
  # =======================================================
  # Backend Service: Node.js + Express + Socket.IO REST API
  # =======================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_event_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    env_file:
      - ./backend/.env
    networks:
      - campus_network

  # =======================================================
  # Frontend Service: React + Vite + Tailwind (Nginx Production)
  # =======================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
        - VITE_SOCKET_URL=http://localhost:5000
    container_name: campus_event_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - campus_network

networks:
  campus_network:
    driver: bridge
